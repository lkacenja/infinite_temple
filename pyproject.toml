[project]
name = "infinite-temple"
version = "0.1.0"
description = "A roguelike space horror game with LLM-generated temples"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pygame>=2.6.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.60.0",
    "tenacity>=8.0.0",
    "tomita>=0.2.0",
    "cairosvg>=2.7.0",
    "pedalboard>=0.9.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infinite_temple*"]
