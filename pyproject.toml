[project]
name = "infinite_temple"
version = "0.1.0"
description = "A simple game called Infinite Temple."
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
requires-python = ">=3.8" # Or whatever Python version you are using
license = { text = "MIT" } # Or choose a different license
keywords = ["game", "infinite-temple"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha", # You can change this as your game develops
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
]
readme = "README.md" # If you plan to have a README file

[project.urls]
Homepage = "https://github.com/yourusername/infinite_temple" # If you have a GitHub repo
"Bug Tracker" = "https://github.com/yourusername/infinite_temple/issues" # For bug reporting

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
   build-backend = "setuptools.build_meta"

