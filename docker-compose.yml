services:
  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - 11434:11434
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/11434' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  ollama_orchestrator:
    container_name: ollama_orchestrator
    depends_on:
      ollama:
        condition: service_healthy
    build: .
    environment:
      - OLLAMA_HOST=http://ollama:11434
